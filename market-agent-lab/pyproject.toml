[project]
name = "market-agent-lab"
version = "0.1.0"
description = "Multi-agent quantitative market-research and ML system (paper trading / simulation only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.35",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "structlog>=24.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "agents", "core", "data", "features", "models", "backtesting",
    "portfolio", "execution", "learning", "database", "dashboard", "api",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
